<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/monique.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monique Advogados — Gestão Jurídica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica o tema antes da primeira pintura. Se isso rodar depois do
      // React, o usuario ve um flash do tema claro a cada recarga.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefereDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var tema = stored === 'light' || stored === 'dark'
            ? stored
            : (prefereDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', tema === 'dark');
          document.documentElement.style.colorScheme = tema;
        } catch (e) {
          // localStorage bloqueado (modo privado): mantem o tema claro.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
